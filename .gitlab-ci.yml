stages: [test]

default:
  interruptible: true

.node: &node
  image: node:22
  before_script:
    - npm ci

typecheck:
  <<: *node
  stage: test
  # A cross-package import (websocket -> pubsub) resolves via the
  # imported package's dist/index.d.ts, and tsc --noEmit writes no dist of its own — so a package
  # whose dependency hasn't been built first fails to resolve it. `build` first, same as `pack`
  # already does for the same reason; npm's workspace command ordering builds dependencies before
  # dependents, so this doesn't need to be sequenced by hand.
  script:
    - npm run build
    - npm run typecheck

lint:
  <<: *node
  stage: test
  script: npm run lint

test:
  <<: *node
  stage: test
  script: npm test          # per package: build + 2 smoke + 61 golden

test:browser:
  stage: test
  # Backstop for runner trouble starting browsers (see web-test-runner.config.mjs and
  # ground-rules.md): GitLab re-runs a failed job up to twice. A real test failure still ends red.
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  before_script:
    - ARCH=$(uname -m); if [ "$ARCH" = "aarch64" ]; then NODE_ARCH=arm64; else NODE_ARCH=x64; fi
    - curl -fsSL https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-${NODE_ARCH}.tar.gz -o /tmp/node.tar.gz
    - mkdir -p /opt/node22 && tar -xzf /tmp/node.tar.gz -C /opt/node22 --strip-components=1
    - export PATH=/opt/node22/bin:$PATH
    - node -v
    - npm ci
  script: npm run test:browser

pack:
  <<: *node
  stage: test
  script:
    - npm run build
    - npm pack --dry-run --workspaces
    - npm run check-pack
